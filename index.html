<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="Convite de aniversário de 1 ano do José Inácio.">
  <title>Missão Especial — José Inácio 1 Ano</title>

  <style>
    :root{
      --azul:#12adff;
      --azul2:#0076cf;
      --dourado:#ffd979;
      --escuro:#02040a;
      --ease:cubic-bezier(.16,.84,.2,1);
      --ease-back:cubic-bezier(.18,1.35,.3,1);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#02040a}
    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at 50% 0%,rgba(18,173,255,.28),transparent 38%),
        linear-gradient(180deg,#02040a 0%,#06111c 55%,#02040a 100%);
    }

    body.locked{overflow:hidden}

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      opacity:.28;
      background:
        radial-gradient(circle at 12% 20%,#fff 0 1px,transparent 1.5px),
        radial-gradient(circle at 82% 14%,#fff 0 1px,transparent 1.5px),
        radial-gradient(circle at 65% 75%,#fff 0 1px,transparent 1.5px),
        linear-gradient(125deg,transparent 0 48%,rgba(18,173,255,.06) 49% 51%,transparent 52%);
      background-size:220px 220px,270px 270px,320px 320px,140px 140px;
    }

    .cinema{
      position:fixed;
      inset:0;
      z-index:100;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 50%,rgba(18,173,255,.13),transparent 34%),
        linear-gradient(180deg,#010205,#06101a 58%,#010205);
      transition:opacity .8s ease,visibility .8s ease;
    }

    .cinema.done{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .cinema::before,
    .cinema::after{
      content:"";
      position:absolute;
      inset:-20%;
      pointer-events:none;
    }

    .cinema::before{
      background:repeating-linear-gradient(105deg,transparent 0 44px,rgba(18,173,255,.035) 45px 46px);
      animation:gridDrift 12s linear infinite;
    }

    .cinema::after{
      opacity:.6;
      background:radial-gradient(circle at center,transparent 28%,rgba(0,0,0,.75) 80%);
    }

    .intro-copy{
      position:absolute;
      top:max(30px,env(safe-area-inset-top));
      left:16px;
      right:16px;
      z-index:12;
      text-align:center;
      transition:opacity .45s ease,transform .6s var(--ease);
    }

    .intro-copy p{
      margin:0 0 8px;
      color:#a9e4ff;
      font-size:clamp(.72rem,2.5vw,.96rem);
      font-weight:900;
      letter-spacing:.2em;
      text-transform:uppercase;
      text-shadow:0 0 18px rgba(18,173,255,.75);
    }

    .intro-copy h1{
      margin:0;
      font-size:clamp(1.45rem,5.6vw,3.15rem);
      line-height:1;
      text-transform:uppercase;
      text-shadow:0 4px 0 #004574,0 0 28px rgba(18,173,255,.55);
    }

    .case-scene{
      position:relative;
      width:min(94vw,640px);
      aspect-ratio:1/1;
      z-index:5;
      perspective:1500px;
      transform-style:preserve-3d;
      filter:drop-shadow(0 36px 42px rgba(0,0,0,.7));
      transition:opacity .8s ease,filter .8s ease,transform 1.15s var(--ease);
    }

    .case-img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
      backface-visibility:hidden;
      will-change:transform,opacity,filter;
    }

    .case-closed{z-index:5;opacity:1}
    .case-open{
      z-index:4;
      opacity:0;
      transform:translateY(20px) scale(.93) rotateX(8deg);
      filter:brightness(.55) blur(5px);
    }

    .seam-light{
      position:absolute;
      left:20%;
      right:20%;
      top:48%;
      height:4px;
      z-index:7;
      opacity:0;
      border-radius:999px;
      background:linear-gradient(90deg,transparent,#fff6c9 18%,#fff 50%,#63cbff 82%,transparent);
      box-shadow:0 0 12px #fff,0 0 28px var(--dourado),0 0 48px var(--azul);
      transform:scaleX(.2);
    }

    .inner-glow{
      position:absolute;
      inset:26% 14% 11%;
      z-index:2;
      opacity:0;
      border-radius:50%;
      background:radial-gradient(circle,#fff8d1 0 4%,rgba(255,214,113,.9) 15%,rgba(18,173,255,.48) 42%,transparent 72%);
      filter:blur(24px);
      transform:scale(.55);
    }

    .open-btn{
      position:absolute;
      z-index:14;
      left:50%;
      bottom:2.5%;
      transform:translateX(-50%);
      min-width:240px;
      border:2px solid #e8faff;
      border-radius:999px;
      padding:15px 26px;
      cursor:pointer;
      color:#fff;
      font-size:1rem;
      font-weight:1000;
      letter-spacing:.07em;
      text-transform:uppercase;
      background:linear-gradient(180deg,#25c5ff,#0075cc);
      box-shadow:0 8px 0 #004979,0 15px 32px rgba(0,0,0,.45),0 0 30px rgba(18,173,255,.45);
      animation:buttonPulse 2.2s ease-in-out infinite;
      transition:transform .2s ease,opacity .35s ease,filter .35s ease;
    }

    .open-btn:active{transform:translate(-50%,7px)}
    .open-btn:focus-visible{outline:4px solid #fff;outline-offset:4px}

    .particle{
      position:absolute;
      left:50%;
      top:54%;
      width:7px;
      height:7px;
      z-index:9;
      border-radius:50%;
      opacity:0;
      background:#fff7c7;
      box-shadow:0 0 10px #fff,0 0 24px var(--azul);
      --x:0px;
      --y:-120px;
      --delay:0s;
    }

    .p1{--x:-180px;--y:-150px;--delay:.02s}.p2{--x:-115px;--y:-210px;--delay:.08s}
    .p3{--x:-50px;--y:-180px;--delay:.15s}.p4{--x:35px;--y:-230px;--delay:.04s}
    .p5{--x:120px;--y:-175px;--delay:.12s}.p6{--x:190px;--y:-130px;--delay:.18s}
    .p7{--x:-205px;--y:-55px;--delay:.1s}.p8{--x:205px;--y:-65px;--delay:.05s}
    .p9{--x:-95px;--y:-80px;--delay:.2s}.p10{--x:85px;--y:-95px;--delay:.14s}

    .projection{
      position:fixed;
      z-index:20;
      left:50%;
      top:54%;
      width:min(92vw,620px);
      opacity:0;
      pointer-events:none;
      transform:translate(-50%,-2%) scale(.12) rotateX(72deg) rotateZ(-2deg);
      transform-origin:50% 100%;
      filter:blur(12px) brightness(1.45);
      will-change:transform,opacity,filter;
    }

    .projection img{
      display:block;
      width:100%;
      height:auto;
      border-radius:18px;
      border:2px solid rgba(83,200,255,.9);
      box-shadow:0 0 24px rgba(18,173,255,.65),0 0 80px rgba(255,217,121,.28),0 42px 80px rgba(0,0,0,.7);
    }

    .unlock-label{
      position:fixed;
      z-index:32;
      left:50%;
      top:50%;
      opacity:0;
      transform:translate(-50%,-50%) scale(.8);
      padding:12px 20px;
      border:1px solid rgba(255,255,255,.7);
      border-radius:999px;
      color:#fff;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      white-space:nowrap;
      background:rgba(2,4,10,.62);
      box-shadow:0 0 32px rgba(18,173,255,.5);
      backdrop-filter:blur(8px);
    }

    .flash{
      position:fixed;
      inset:0;
      z-index:30;
      pointer-events:none;
      opacity:0;
      background:radial-gradient(circle at 50% 56%,rgba(255,255,255,.96),rgba(255,220,134,.68) 12%,rgba(18,173,255,.32) 34%,transparent 66%);
      mix-blend-mode:screen;
    }

    .cinema.opening .intro-copy{opacity:0;transform:translateY(-18px)}
    .cinema.opening .open-btn{opacity:0;pointer-events:none;filter:blur(4px)}
    .cinema.opening .case-closed{animation:caseUnlock .62s ease both}
    .cinema.opening .seam-light{animation:seamIgnite .66s ease .16s both}

    .cinema.opened .case-closed{
      opacity:0;
      transform:translateY(-26px) scale(.9) rotateX(-65deg);
      transition:opacity .28s ease,transform .55s var(--ease);
    }

    .cinema.opened .case-open{
      opacity:1;
      transform:translateY(0) scale(1) rotateX(0);
      filter:brightness(1) blur(0);
      transition:opacity .32s ease,transform .8s var(--ease),filter .65s ease;
    }

    .cinema.opened .inner-glow{animation:glowBurst 1.4s var(--ease) both}
    .cinema.opened .particle{animation:particleBurst 1.35s var(--ease) var(--delay) both}
    .cinema.opened .flash{animation:flashBurst .8s ease both}

    .cinema.projecting .projection{
      animation:inviteLaunch 2.15s var(--ease-back) both;
    }

    .cinema.projecting .case-scene{
      transform:translateY(34vh) scale(.72);
      filter:blur(7px) brightness(.48) drop-shadow(0 25px 30px rgba(0,0,0,.6));
      opacity:.18;
    }

    .cinema.projecting .unlock-label{animation:unlockText 1.35s ease 1.1s both}

    .page{
      min-height:100svh;
      padding:18px 12px max(34px,env(safe-area-inset-bottom));
      opacity:0;
      transform:translateY(26px);
      transition:opacity .9s ease,transform 1s var(--ease);
    }

    .page.visible{opacity:1;transform:none}

    .invite-wrap{
      width:min(100%,680px);
      margin:0 auto;
      text-align:center;
    }

    .invite-card{
      position:relative;
      overflow:hidden;
      border-radius:20px;
      background:#000;
      border:2px solid rgba(38,178,255,.88);
      box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 40px rgba(18,173,255,.24);
      animation:cardFloat 5.5s ease-in-out infinite;
    }

    .invite-card::after{
      content:"";
      position:absolute;
      z-index:4;
      top:-30%;
      bottom:-30%;
      width:22%;
      left:-32%;
      pointer-events:none;
      opacity:0;
      transform:skewX(-18deg);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.52),transparent);
    }

    .page.visible .invite-card::after{animation:shineSweep 1.25s ease 1s both}

    .invite-card img{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
    }

    .hotspot{
      position:absolute;
      top:83.2%;
      width:24%;
      height:11.3%;
      z-index:8;
      border-radius:50%;
      color:transparent;
      text-indent:-9999px;
      overflow:hidden;
      background:transparent;
      transition:background .2s ease,box-shadow .2s ease,transform .2s ease;
    }

    .hotspot:active{transform:scale(.94);background:rgba(255,255,255,.1)}
    .hotspot:focus-visible{outline:4px solid #fff;outline-offset:-4px;background:rgba(255,255,255,.12)}
    .calendar{left:9.5%}.whatsapp{left:38%}.location{left:66.5%}

    .hint{
      margin:18px auto 0;
      color:#bfdff1;
      font-size:clamp(.84rem,3.4vw,1rem);
    }

    @keyframes gridDrift{to{transform:translate3d(8%,4%,0)}}
    @keyframes buttonPulse{0%,100%{box-shadow:0 8px 0 #004979,0 15px 32px rgba(0,0,0,.45),0 0 20px rgba(18,173,255,.32)}50%{box-shadow:0 8px 0 #004979,0 15px 32px rgba(0,0,0,.45),0 0 42px rgba(18,173,255,.68)}}
    @keyframes caseUnlock{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-8px) rotate(-.8deg)}42%{transform:translateX(8px) rotate(.8deg)}62%{transform:translateX(-5px) rotate(-.45deg)}82%{transform:translateX(3px) rotate(.25deg)}}
    @keyframes seamIgnite{0%{opacity:0;transform:scaleX(.1)}35%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.15)}}
    @keyframes glowBurst{0%{opacity:0;transform:scale(.35)}28%{opacity:1;transform:scale(1.3)}100%{opacity:.35;transform:scale(1)}}
    @keyframes flashBurst{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
    @keyframes particleBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.3)}}
    @keyframes inviteLaunch{
      0%{opacity:0;transform:translate(-50%,-2%) scale(.12) rotateX(72deg) rotateZ(-2deg);filter:blur(12px) brightness(1.55)}
      18%{opacity:1}
      46%{transform:translate(-50%,-52%) scale(.47) rotateX(15deg) rotateZ(1deg);filter:blur(3px) brightness(1.22)}
      76%{transform:translate(-50%,-50%) scale(.94) rotateX(0) rotateZ(-.3deg);filter:blur(0) brightness(1.04)}
      100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotateX(0) rotateZ(0);filter:none}
    }
    @keyframes unlockText{0%{opacity:0;transform:translate(-50%,-45%) scale(.82)}22%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(1.05)}}
    @keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes shineSweep{0%{left:-32%;opacity:0}20%{opacity:.8}100%{left:120%;opacity:0}}

    @media (max-width:540px){
      .case-scene{width:98vw}
      .open-btn{bottom:1%;min-width:218px;padding:14px 20px}
      .projection{width:94vw}
      .page{padding-left:8px;padding-right:8px}
      .invite-card{border-radius:15px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body class="locked">

  <section class="cinema" id="cinema" aria-label="Abertura da maleta de missões">
    <div class="intro-copy">
      <p>Arquivo confidencial • Baby Corp</p>
      <h1>Maleta de Missões Especiais</h1>
    </div>

    <div class="case-scene" id="caseScene">
      <div class="inner-glow"></div>
      <div class="seam-light"></div>

      <img class="case-img case-closed" src="assets/maleta-fechada.jpg" alt="Maleta preta fechada com detalhes dourados.">
      <img class="case-img case-open" src="assets/maleta-aberta.jpg" alt="Maleta aberta contendo mamadeira, chupeta, fralda e cartão de missão especial.">

      <span class="particle p1"></span><span class="particle p2"></span>
      <span class="particle p3"></span><span class="particle p4"></span>
      <span class="particle p5"></span><span class="particle p6"></span>
      <span class="particle p7"></span><span class="particle p8"></span>
      <span class="particle p9"></span><span class="particle p10"></span>

      <button class="open-btn" id="openButton" type="button" aria-expanded="false">Abrir maleta</button>
    </div>

    <div class="projection" id="projection" aria-hidden="true">
      <img src="assets/convite-jose-inacio.jpg" alt="">
    </div>

    <div class="unlock-label">Missão desbloqueada</div>
    <div class="flash"></div>
  </section>

  <main class="page" id="page">
    <section class="invite-wrap">
      <article class="invite-card" aria-label="Convite de aniversário de José Inácio">
        <img src="assets/convite-jose-inacio.jpg" alt="Convite do aniversário de 1 ano do José Inácio, dia 12 de setembro de 2026, às 16 horas.">

        <a class="hotspot calendar" href="evento-jose-inacio.ics" download="Aniversario-Jose-Inacio.ics" aria-label="Adicionar aniversário ao calendário">Adicionar ao calendário</a>

        <a class="hotspot whatsapp" href="https://wa.me/5566999612926?text=Ol%C3%A1%21%20Miss%C3%A3o%20recebida%20com%20sucesso%20%F0%9F%95%B6%EF%B8%8F%F0%9F%92%BC%20Confirmo%20minha%20presen%C3%A7a%20na%20comemora%C3%A7%C3%A3o%20de%201%20ano%20do%20nosso%20pequeno%20chefe%20Jos%C3%A9%20In%C3%A1cio%21%20%F0%9F%8E%89%F0%9F%8D%BC" target="_blank" rel="noopener noreferrer" aria-label="Confirmar presença pelo WhatsApp">Confirmar presença</a>

        <a class="hotspot location" href="https://maps.app.goo.gl/LLVXrBMMtzkzak449?g_st=ic" target="_blank" rel="noopener noreferrer" aria-label="Abrir localização da festa">Ver localização</a>
      </article>

      <p class="hint">Toque nos três botões do convite para interagir.</p>
    </section>
  </main>

  <script>
    const cinema = document.getElementById('cinema');
    const button = document.getElementById('openButton');
    const page = document.getElementById('page');
    let started = false;

    function playCinematicSound(){
      try{
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if(!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        function tone(freq,start,duration,type='sine',gainValue=.08,endFreq=null){
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq,now+start);
          if(endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq,now+start+duration);
          gain.gain.setValueAtTime(.0001,now+start);
          gain.gain.exponentialRampToValueAtTime(gainValue,now+start+.025);
          gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);
          osc.connect(gain).connect(ctx.destination);
          osc.start(now+start);
          osc.stop(now+start+duration+.05);
        }

        tone(180,.02,.12,'square',.055,115);
        tone(120,.19,.16,'square',.045,80);
        tone(260,.43,.9,'sine',.04,720);
        tone(420,.5,1.3,'sine',.025,1180);
        tone(760,.7,.65,'triangle',.018,1460);
        setTimeout(()=>ctx.close().catch(()=>{}),2600);
      }catch(e){/* som opcional */}
    }

    function openMission(){
      if(started) return;
      started = true;
      button.setAttribute('aria-expanded','true');
      playCinematicSound();

      cinema.classList.add('opening');

      setTimeout(()=>{
        cinema.classList.add('opened');
      },520);

      setTimeout(()=>{
        cinema.classList.add('projecting');
      },1050);

      setTimeout(()=>{
        page.classList.add('visible');
        cinema.classList.add('done');
        document.body.classList.remove('locked');
        window.scrollTo({top:0,behavior:'auto'});
      },3300);
    }

    button.addEventListener('click',openMission);
  </script>
</body>
</html>
