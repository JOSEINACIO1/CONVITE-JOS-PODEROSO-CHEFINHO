<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02040a">
  <meta name="description" content="Convite de aniversário de 1 ano do José Inácio.">
  <title>Missão Especial — José Inácio 1 Ano</title>

  <style>
    :root{
      --azul:#12adff;
      --azul-escuro:#006bbf;
      --dourado:#e6bd62;
      --preto:#02040a;
      --branco:#fff;
      --ease:cubic-bezier(.2,.8,.18,1);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at 50% 0%,rgba(18,173,255,.34),transparent 34%),
        linear-gradient(180deg,#020307 0%,#07121e 52%,#020307 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.34;
      background:
        linear-gradient(120deg,transparent 0 48%,rgba(18,173,255,.07) 49% 51%,transparent 52%),
        radial-gradient(circle at 15% 25%,#fff 0 1px,transparent 1.6px),
        radial-gradient(circle at 78% 14%,#fff 0 1px,transparent 1.6px),
        radial-gradient(circle at 63% 78%,#fff 0 1px,transparent 1.6px);
      background-size:120px 120px,220px 220px,260px 260px,310px 310px;
    }

    .page{
      min-height:100svh;
      display:grid;
      place-items:start center;
      padding:28px 14px 50px;
    }

    .mission{
      width:min(96vw,760px);
      text-align:center;
    }

    .eyebrow{
      margin:0 0 8px;
      color:#a9e2ff;
      font-weight:900;
      font-size:clamp(.78rem,2.7vw,1rem);
      letter-spacing:.18em;
      text-transform:uppercase;
      text-shadow:0 0 14px rgba(18,173,255,.65);
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(1.7rem,6vw,3.25rem);
      line-height:1;
      text-transform:uppercase;
      text-shadow:0 4px 0 #004b86,0 0 28px rgba(18,173,255,.48);
    }

    .case-stage{
      position:relative;
      width:min(94vw,620px);
      aspect-ratio:1/1;
      margin:0 auto;
      perspective:1800px;
      transform-style:preserve-3d;
      filter:drop-shadow(0 30px 34px rgba(0,0,0,.55));
      transition:opacity .55s ease, transform .9s var(--ease), filter .8s ease;
    }

    .case-stage::before{
      content:"";
      position:absolute;
      left:18%;
      right:18%;
      bottom:10%;
      height:13%;
      z-index:0;
      border-radius:50%;
      background:rgba(0,0,0,.72);
      filter:blur(20px);
      transform:scaleX(.9);
      transition:opacity .6s ease,transform .8s var(--ease);
    }

    .case-image{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
      border-radius:26px;
      backface-visibility:hidden;
      will-change:transform,opacity,filter;
    }

    .closed{
      z-index:4;
      opacity:1;
      transform:translateY(0) rotateX(0) scale(1);
      transition:
        transform .95s var(--ease),
        opacity .52s ease .36s,
        filter .7s ease;
    }

    .opened{
      z-index:3;
      opacity:0;
      transform:translateY(28px) rotateX(14deg) scale(.88);
      filter:blur(8px) brightness(.65);
      transition:
        transform 1.15s var(--ease) .38s,
        opacity .55s ease .4s,
        filter .85s ease .42s;
    }

    .glow{
      position:absolute;
      inset:12%;
      z-index:1;
      opacity:0;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,224,140,.75),rgba(18,173,255,.36) 38%,transparent 70%);
      filter:blur(24px);
      transform:scale(.7);
      transition:opacity .8s ease,transform 1.2s var(--ease);
    }

    .spark{
      position:absolute;
      width:9px;
      height:9px;
      border-radius:50%;
      z-index:7;
      opacity:0;
      background:#fff3b4;
      box-shadow:0 0 14px #ffe59a,0 0 25px var(--azul);
    }
    .s1{left:22%;top:21%}.s2{right:21%;top:26%}.s3{left:18%;bottom:27%}
    .s4{right:16%;bottom:22%}.s5{left:50%;top:12%}

    .open-button{
      position:absolute;
      z-index:10;
      left:50%;
      bottom:1.8%;
      transform:translateX(-50%);
      min-width:245px;
      border:2px solid #d9f5ff;
      border-radius:999px;
      padding:15px 24px;
      cursor:pointer;
      color:#fff;
      font-size:1rem;
      font-weight:1000;
      letter-spacing:.06em;
      text-transform:uppercase;
      background:linear-gradient(180deg,#1fc0ff,#0073cc);
      box-shadow:0 8px 0 #004c88,0 16px 30px rgba(0,0,0,.38),0 0 25px rgba(18,173,255,.4);
      transition:transform .2s ease,opacity .35s ease,box-shadow .2s ease;
    }
    .open-button:active{
      transform:translate(-50%,7px);
      box-shadow:0 2px 0 #004c88,0 8px 18px rgba(0,0,0,.35);
    }
    .open-button:focus-visible{outline:4px solid #fff;outline-offset:4px}

    .invite-stage{
      position:fixed;
      inset:0;
      z-index:50;
      display:grid;
      place-items:start center;
      width:100%;
      min-height:100svh;
      padding:20px 14px 50px;
      overflow-y:auto;
      pointer-events:none;
      visibility:hidden;
      opacity:0;
      transform:translateY(34vh) scale(.18) rotateX(24deg);
      transform-origin:50% 18%;
      filter:blur(12px) brightness(1.35);
      background:
        radial-gradient(circle at 50% 16%,rgba(255,224,140,.24),transparent 28%),
        radial-gradient(circle at 50% 0%,rgba(18,173,255,.28),transparent 38%),
        linear-gradient(180deg,#020307 0%,#07121e 52%,#020307 100%);
      transition:
        visibility 0s linear 1.35s,
        opacity .7s ease .7s,
        transform 1.25s cubic-bezier(.16,.84,.16,1) .55s,
        filter 1s ease .58s;
    }

    .invite-stage::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.28;
      background:
        radial-gradient(circle at 12% 22%,#fff 0 1px,transparent 1.8px),
        radial-gradient(circle at 80% 14%,#fff 0 1px,transparent 1.8px),
        radial-gradient(circle at 66% 76%,#fff 0 1px,transparent 1.8px);
      background-size:220px 220px,260px 260px,310px 310px;
    }

    .invite-card{
      position:relative;
      overflow:hidden;
      border-radius:20px;
      background:#000;
      border:2px solid rgba(38,178,255,.85);
      box-shadow:0 26px 75px rgba(0,0,0,.7),0 0 40px rgba(18,173,255,.28);
    }

    .invite-card img{
      display:block;
      width:100%;
      height:auto;
      user-select:none;
      -webkit-user-drag:none;
    }

    .hotspot{
      position:absolute;
      top:83.2%;
      width:24%;
      height:11.3%;
      z-index:5;
      border-radius:50%;
      color:transparent;
      text-indent:-9999px;
      overflow:hidden;
      background:transparent;
    }
    .calendar{left:9.5%}
    .whatsapp{left:38%}
    .location{left:66.5%}
    .hotspot:focus-visible{
      outline:4px solid #fff;
      outline-offset:-4px;
      background:rgba(255,255,255,.12);
    }

    .hint{
      margin:17px auto 0;
      color:#b7dff6;
      font-size:.88rem;
    }

    .mission.opening .closed{
      animation:unlockShake .42s ease both;
      filter:brightness(1.06);
    }

    .mission.open .closed{
      opacity:0;
      transform:translateY(-28px) rotateX(-74deg) scale(.9);
      pointer-events:none;
    }

    .mission.open .opened{
      opacity:1;
      transform:translateY(0) rotateX(0) scale(1);
      filter:blur(0) brightness(1);
    }

    .mission.open .glow{
      opacity:1;
      transform:scale(1.18);
    }

    .mission.open .open-button{
      opacity:0;
      pointer-events:none;
      transform:translate(-50%,12px) scale(.92);
    }

    .mission.open .spark{
      animation:sparkle 1.2s ease-in-out .65s both;
    }

    .mission.open .case-stage{
      animation:caseExit .9s cubic-bezier(.55,.08,.68,.53) 1.2s both;
      pointer-events:none;
    }

    .mission.open .case-stage::before{
      opacity:0;
      transform:scaleX(.4);
    }

    .mission.open .eyebrow,
    .mission.open h1{
      animation:headerExit .55s ease 1.2s both;
    }

    .mission.open .invite-stage{
      visibility:visible;
      pointer-events:auto;
      opacity:1;
      transform:translateY(0) scale(1) rotateX(0);
      filter:blur(0) brightness(1);
      transition:
        visibility 0s,
        opacity .7s ease .7s,
        transform 1.25s cubic-bezier(.16,.84,.16,1) .55s,
        filter 1s ease .58s;
    }

    .mission.open .invite-card{
      animation:cardSettle .9s var(--ease) 1.45s both;
    }


    @keyframes caseExit{
      0%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
      45%{opacity:1;transform:translateY(18px) scale(.94);filter:blur(0)}
      100%{opacity:0;transform:translateY(110px) scale(.72);filter:blur(12px)}
    }

    @keyframes headerExit{
      to{opacity:0;transform:translateY(-18px);filter:blur(7px)}
    }

    @keyframes cardSettle{
      0%{transform:scale(1.045)}
      55%{transform:scale(.985)}
      100%{transform:scale(1)}
    }

    @keyframes unlockShake{
      0%,100%{transform:translateX(0) rotate(0)}
      24%{transform:translateX(-7px) rotate(-.7deg)}
      48%{transform:translateX(7px) rotate(.7deg)}
      72%{transform:translateX(-3px) rotate(-.3deg)}
    }

    @keyframes sparkle{
      0%{opacity:0;transform:scale(.2) translateY(12px)}
      35%{opacity:1;transform:scale(1.5) translateY(-8px)}
      100%{opacity:0;transform:scale(.3) translateY(-35px)}
    }

    @media (max-width:540px){
      .page{padding-top:24px}
      .case-stage{width:96vw}
      .open-button{bottom:0;min-width:220px;padding:14px 20px}
      .invite-stage{margin-top:-15px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important}
      .closed,.opened,.glow,.invite-stage,.open-button{transition:none!important}
      .mission.opening .closed,.mission.open .spark{animation:none!important}
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="mission" id="mission">
      <p class="eyebrow">Arquivo confidencial • Baby Corp</p>
      <h1>Maleta de Missões Especiais</h1>

      <div class="case-stage" id="caseStage">
        <div class="glow"></div>

        <img
          class="case-image closed"
          src="assets/maleta-fechada.jpg"
          alt="Maleta preta fechada com detalhes dourados."
        >

        <img
          class="case-image opened"
          src="assets/maleta-aberta.jpg"
          alt="Maleta aberta contendo mamadeira, chupeta, fralda e cartão de missão especial."
        >

        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <span class="spark s4"></span>
        <span class="spark s5"></span>

        <button class="open-button" id="openButton" type="button" aria-expanded="false">
          Abrir maleta
        </button>
      </div>

      <div class="invite-stage" id="inviteStage" tabindex="-1">
        <article class="invite-card" aria-label="Convite de aniversário de José Inácio">
          <img
            src="assets/convite-jose-inacio.jpg"
            alt="Convite do aniversário de 1 ano do José Inácio, dia 12 de setembro de 2026, às 16 horas."
          >

          <a
            class="hotspot calendar"
            href="evento-jose-inacio.ics"
            download="Aniversario-Jose-Inacio.ics"
            aria-label="Adicionar aniversário ao calendário"
          >Adicionar ao calendário</a>

          <a
            class="hotspot whatsapp"
            href="https://wa.me/5566999612926?text=Ol%C3%A1%21%20Miss%C3%A3o%20recebida%20com%20sucesso%20%F0%9F%95%B6%EF%B8%8F%F0%9F%92%BC%20Confirmo%20minha%20presen%C3%A7a%20na%20comemora%C3%A7%C3%A3o%20de%201%20ano%20do%20nosso%20pequeno%20chefe%20Jos%C3%A9%20In%C3%A1cio%21%20%F0%9F%8E%89%F0%9F%8D%BC"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Confirmar presença pelo WhatsApp"
          >Confirmar presença</a>

          <a
            class="hotspot location"
            href="https://maps.app.goo.gl/LLVXrBMMtzkzak449?g_st=ic"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir localização da festa"
          >Ver localização</a>
        </article>

        <p class="hint">Toque nos três botões do convite para interagir.</p>
      </div>
    </section>
  </main>

  <script>
    const mission = document.getElementById('mission');
    const button = document.getElementById('openButton');
    const invite = document.getElementById('inviteStage');

    function openMission(){
      if(mission.classList.contains('open') || mission.classList.contains('opening')) return;

      mission.classList.add('opening');
      button.setAttribute('aria-expanded','true');

      setTimeout(() => {
        mission.classList.remove('opening');
        mission.classList.add('open');
        document.body.style.overflow = 'hidden';
      }, 420);

      setTimeout(() => {
        invite.scrollTop = 0;
        invite.focus({preventScroll:true});
      }, 1450);
    }

    button.addEventListener('click', openMission);
  </script>
</body>
</html>
